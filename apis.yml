aid: plenful
name: Plenful
description: 'Plenful is an AI-powered workflow automation platform for pharmacy and healthcare
  operations, founded in 2021 and headquartered in San Francisco with an office in New York City.
  The platform automates complex, high-ROI administrative pharmacy workflows — 340B audit and
  optimization, 340B referral capture, rebate and Maximum Fair Price (MFP) reconciliation, benefits
  verification and prior authorization, and infusion order intake — using large language models and
  machine learning tuned to each organization''s data. It ingests PDFs, flat files, APIs, HL7 feeds,
  and databases, supports unlimited organizational logic rules, and serves 100+ healthcare
  organizations including Prisma Health, Renown Health, Temple Health, Cencora, and Samaritan Health
  Services. Plenful is backed by Bessemer Venture Partners, Notable Capital (formerly GGV Capital),
  SUSA Ventures, TQ Ventures, and Waterline Ventures. Plenful ships an enterprise SaaS product and does
  not currently publish a public developer API, SDK, or documentation surface.'
